spring:
  application:
    name: finguard-core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finguard}
    username: ${POSTGRES_USER:finguard}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    # 도구 호출 이벤트 스트림. 릴레이가 꺼져 있으면(기본) 아무도 접속하지 않는다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # 브로커가 기록을 확정한 뒤에만 ack. 멱등 프로듀서는 재시도 중복과 순서 뒤바뀜을 막는다.
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 죽어 있을 때 send()가 메타데이터를 기다리며 릴레이 스레드를 붙잡는 상한.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 0
  flyway:
    # 경로를 오타 내면 조용히 무시되는 대신 기동에 실패한다. 시드 경로가 무시되면 기동은 성공하는데
    # 데모 데이터가 없어서, 원인이 로그에 남지 않는 실패가 된다.
    fail-on-missing-locations: true

finguard:
  internal:
    # 값이 없으면 기동에 실패한다. 인증이 사실상 꺼진 Internal API가 떠 있는 상태를 만들지 않는다.
    credential: ${FINGUARD_INTERNAL_CREDENTIAL:}
  agent:
    # docs/04 §3.1 — Agent는 8082에서 실행하고 Compose 주소는 http://agent:8082 다.
    base-url: ${AGENT_URL:http://localhost:8082}
    # Agent의 /internal/** 도 같은 공유 자격 증명으로 보호된다. 값이 하나뿐인 것은 P0의 전제다.
    internal-credential: ${finguard.internal.credential}
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:1000}
    # Agent는 Gateway와 Mock Finance를 거쳐 오므로 한 Tool Call보다 넉넉해야 한다.
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:10000}
  risk:
    # docs/04 §8 — ai-risk는 8000에서 실행하고 Compose 주소는 http://ai-risk:8000 이다.
    # 이슈 #72가 compose에 서비스를 올리기 전까지 이 주소는 닿지 않는다. 그때는 평가가
    # 실패하고 스냅샷이 NOT_EVALUATED로 남는다 — 의도한 동작이다(AC-14).
    base-url: ${AI_RISK_URL:http://localhost:8000}
    # ai-risk의 /internal/** 도 같은 공유 자격 증명으로 보호된다.
    service-credential: ${finguard.internal.credential}
    connect-timeout-ms: ${AI_RISK_CONNECT_TIMEOUT_MS:1000}
    # ONNX 추론 한 번이다. Agent 왕복(10초)보다 짧아도 된다.
    read-timeout-ms: ${AI_RISK_READ_TIMEOUT_MS:3000}
  audit:
    reconciliation:
      # 결과 기록이 오지 않은 PROCESSING 행을 OUTCOME_UNKNOWN으로 드러낸다 — docs/06 §10.
      # 끄면 유실이 다시 조용해진다. 테스트처럼 직접 호출할 때만 끈다.
      enabled: ${AUDIT_RECONCILIATION_ENABLED:true}
      # DB 수신 시각 기준. 잠정값 — 성공 경로 지연을 측정해 근거를 남기고 조정한다.
      threshold: ${AUDIT_RECONCILIATION_THRESHOLD:60s}
      interval: ${AUDIT_RECONCILIATION_INTERVAL:5s}
      batch-size: ${AUDIT_RECONCILIATION_BATCH_SIZE:100}
  events:
    relay:
      # 아웃박스 → Kafka 릴레이. Kafka가 없는 기본 스택에서는 끈다(K 덧씌우기에서 켠다).
      # 꺼져 있어도 이벤트는 아웃박스에 쌓인다 — 켜는 순간 쌓인 순서대로 발행된다.
      enabled: ${EVENT_RELAY_ENABLED:false}
      topic: ${EVENT_RELAY_TOPIC:finguard.tool-call.events.v1}
      interval: ${EVENT_RELAY_INTERVAL:500ms}
      batch-size: ${EVENT_RELAY_BATCH_SIZE:100}
      # ack 대기 상한. 이 안에 ack가 없으면 그 행은 미발행으로 남고 다음 주기에 다시 보낸다.
      send-timeout: ${EVENT_RELAY_SEND_TIMEOUT:10s}
    alerts:
      # 이상 징후 경보 소비자. Kafka가 없는 기본 스택에서는 끈다(K 덧씌우기에서 켠다).
      enabled: ${EVENT_ALERTS_ENABLED:false}
      group-id: finguard-anomaly-alert
      dlt-topic: ${EVENT_ALERTS_DLT_TOPIC:finguard.tool-call.events.v1.dlt}
      # 고정 UTC 버킷. 같은 에이전트·버킷에서 BLOCK 5회 이상, riskFlagged 결과 3회 이상이면 경보.
      # OUTCOME_UNKNOWN은 즉시(에이전트·버킷당 1건).
      window: 60s
      block-threshold: 5
      risk-flag-threshold: 3
    reevaluation:
      # 후보 정책 전용 OPA. 운영 OPA(Gateway가 쓰는)와 분리한다.
      candidate-opa-url: ${CANDIDATE_OPA_URL:http://localhost:8182}
      opa-timeout: 2s
      poll-timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${CORE_API_PORT:8080}

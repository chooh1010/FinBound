# 테스트 컨텍스트마다 조정 배치 스케줄러가 돌면, 그 클래스의 Testcontainers DB가 내려간 뒤에도
# 접속을 시도한다(시도마다 커넥션 대기 30초). 테스트에서는 기본으로 끄고, 스케줄러를 확인하는
# OutcomeReconciliationSchedulingTest만 켠다. 조정 로직은 OutcomeReconciler를 직접 불러 검증한다.
finguard.audit.reconciliation.enabled=false
# 만료 배치도 같은 이유로 끈다. 로직은 ApprovalExpiry를 직접 불러 검증한다.
finguard.approval.expiry.enabled=false
finguard.approval.expiry.interval=10s
finguard.approval.expiry.batch-size=100
# 시퀀서도 직접 부른다. 피드 번호 순서를 테스트가 정한다.
finguard.events.sequencer.enabled=false
# 승인 알림 소비자도 직접 부른다.
finguard.events.notifications.enabled=false
